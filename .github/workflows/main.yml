name: Build Graphing Lab APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

# contents: write مطلوب لنشر ملف APK في صفحة Releases
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "GraphingLab-v${APP_VERSION}.apk"
          ls -lh GraphingLab-v*.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphingLab-apk
          path: GraphingLab-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Graphing Lab v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body: "حمّل ملف APK من قسم Assets أدناه وثبّته على هاتف أندرويد."
          files: GraphingLab-v${{ env.APP_VERSION }}.apk
