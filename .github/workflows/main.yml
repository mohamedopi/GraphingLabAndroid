
name: Build Graphing Lab APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.1.${{ github.run_number }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download project source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Build Release APK
      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      # 5. Rename APK
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "GraphingLab-v${APP_VERSION}.apk"
          ls -lh GraphingLab-v*.apk

      # 6. Upload APK as GitHub Artifact
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraphingLab-apk
          path: GraphingLab-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      # 7. Publish APK to GitHub Releases
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Graphing Lab v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Graphing Lab Android APK

            حمّل ملف APK من قسم Assets أدناه وثبّته على هاتف أندرويد.
          files: GraphingLab-v${{ env.APP_VERSION }}.apk
